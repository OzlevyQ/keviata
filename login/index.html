<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14261f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><title>כניסה · קביעותא</title><link rel="icon" href="../favicon.svg"><link rel="manifest" href="../manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));background:#f6f1e6;color:#20302a;font:16px/1.55 system-ui}.wrap{width:min(100%,420px);text-align:center}.mark{width:74px;height:74px;border-radius:22px;margin:auto;display:grid;place-items:center;background:#14261f;color:white;font:700 42px serif}.brand{font:900 36px serif;color:#14532d;margin:16px 0 2px}.tag{color:#5d6d65;margin:0 0 24px}.card{background:#fffdf7;border:1px solid #ddd3bd;border-radius:24px;padding:26px 22px;box-shadow:0 18px 50px #20302a18}.msg{min-height:22px;margin-top:14px;color:#8c2f22}.privacy{font-size:13px;color:#5d6d65}.privacy a{color:#14532d}.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:52px;margin-top:18px;padding:12px 18px;border:1px solid #d8d2c2;border-radius:14px;background:#fff;color:#20302a;font:600 16px/1.2 system-ui;cursor:pointer;box-shadow:0 1px 2px #20302a10;transition:background .15s,box-shadow .15s}.gbtn:hover{background:#fafaf7}.gbtn:active{background:#f1efe8;box-shadow:none}.gbtn:focus-visible{outline:3px solid #14532d66;outline-offset:2px}.gbtn:disabled{opacity:.6;cursor:default}.gbtn svg{flex:0 0 auto}</style></head><body><main class="wrap"><div class="mark">ק</div><div class="brand">קביעותא</div><p class="tag">אקטואליה פוגשת מקורות. כמה דקות ביום.</p><section class="card"><h1>כניסה לקביעותא</h1><p>כניסה עם חשבון Google שומרת את ההתקדמות, השמורים וההעדפות שלך.</p><button type="button" class="gbtn" id="gbtn" aria-label="המשך עם Google"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg><span>המשך עם Google</span></button><p class="msg" id="msg" aria-live="polite"></p><p class="privacy">בהמשך מסכימים ל<a href="../privacy.html">מדיניות הפרטיות</a>.</p></section></main><script src="https://unpkg.com/@descope/web-js-sdk@1.53.1/dist/index.umd.js"></script><script>
const msg=t=>{document.getElementById('msg').textContent=t};
const btn=document.getElementById('gbtn');
try{
  const sdk=Descope({projectId:'P3JSQ5xGjXf4sEVQz7q0lTaAgN54',persistTokens:true});
  const code=new URLSearchParams(location.search).get('code');
  if(code){
    btn.disabled=true;msg('משלים התחברות…');
    sdk.oauth.exchange(code).then(r=>{
      if(r&&r.ok)location.replace('../');
      else{console.warn('oauth exchange failed',r&&r.error);msg('ההתחברות נכשלה. נסו שוב בעוד רגע.');btn.disabled=false}
    }).catch(e=>{console.warn('oauth exchange error',e);msg('ההתחברות נכשלה. נסו שוב בעוד רגע.');btn.disabled=false});
  }else{
    sdk.refresh().then(r=>{if(r&&r.data&&r.data.sessionJwt)location.replace('../')}).catch(()=>{});
  }
  btn.onclick=async()=>{
    btn.disabled=true;msg('מעביר ל-Google…');
    try{
      const r=await sdk.oauth.start('google',location.origin+location.pathname);
      const d=r&&r.data;const url=d&&(typeof d==='string'?d:d.url);
      if(!r||!r.ok||!url)throw new Error('oauth start failed');
      location.assign(url);
    }catch(e){console.warn('oauth start failed',e);msg('לא הצלחנו להתחיל את ההתחברות. בדקו את החיבור ונסו שוב.');btn.disabled=false}
  };
}catch(e){msg('לא הצלחנו לטעון את מסך הכניסה. בדקו את החיבור ונסו שוב.')}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{updateViaCache:'none'}));
</script></body></html>
